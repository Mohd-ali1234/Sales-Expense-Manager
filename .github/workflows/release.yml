name: Release desktop app

# Push a tag like v1.0.1 and this builds the Windows installer and
# publishes it as a GitHub Release. Installed apps pick it up automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set app version from the tag
        shell: pwsh
        working-directory: desktop
        run: npm version "$($env:GITHUB_REF_NAME.TrimStart('v'))" --no-git-tag-version --allow-same-version

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend exe
        working-directory: backend
        shell: pwsh
        run: |
          pip install -r requirements.txt pyinstaller
          ./build_server.ps1

      - name: Build and publish installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win --publish always
